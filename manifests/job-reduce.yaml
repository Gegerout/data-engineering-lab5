apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-reduce
  namespace: lab5
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: lab5-worker
      containers:
      - name: pairs
        image: lab5-pairs:1
        imagePullPolicy: IfNotPresent
        args:
        - reduce
        envFrom:
        - secretRef:
            name: s3-credentials
        env:
        - name: S3_ENDPOINT
          value: http://rustfs:9000
        - name: RUN
          value: parallel
        - name: PARTS
          value: '3'
        resources:
          requests:
            cpu: 500m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 160Mi
