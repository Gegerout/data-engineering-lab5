apiVersion: v1
kind: Pod
metadata:
  name: quota-second
  namespace: lab5-quota
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  nodeSelector:
    kubernetes.io/hostname: lab5-worker
  containers:
  - name: hold
    image: lab5-pairs:1
    imagePullPolicy: IfNotPresent
    command:
    - python
    - -c
    - import time; time.sleep(3600)
    resources:
      requests:
        cpu: 400m
        memory: 32Mi
      limits:
        cpu: 400m
        memory: 64Mi
