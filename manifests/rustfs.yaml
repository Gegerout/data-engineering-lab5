apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: lab5
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: lab5
spec:
  selector:
    app: rustfs
  ports:
  - name: s3
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: lab5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      priorityClassName: lab5-storage
      nodeSelector:
        kubernetes.io/hostname: lab5-worker
      initContainers:
      - name: prepare-disks
        image: lab5-pairs:1
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -c
        - import os; from pathlib import Path; [(Path('/data/vol'+str(i)).mkdir(exist_ok=True),os.chown('/data/vol'+str(i),10001,10001))
          for i in range(1,5)]
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.0
        envFrom:
        - secretRef:
            name: s3-credentials
        env:
        - name: RUSTFS_VOLUMES
          value: /data/vol{1...4}
        - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
          value: 'true'
        - name: RUSTFS_STORAGE_CLASS_STANDARD
          value: EC:2
        - name: RUSTFS_CONSOLE_ENABLE
          value: 'false'
        ports:
        - containerPort: 9000
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 3
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rustfs-data
      securityContext:
        fsGroup: 10001
